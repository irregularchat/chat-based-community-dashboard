# Docker Compose for Self-Hosted Signal Bot
# Full stack with PostgreSQL, Redis, and Signal Bot
# Location: /home/signal-bot-selfhosted/

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: signal-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal_bot
      POSTGRES_USER: signal_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /home/signal-bot-selfhosted/data/postgres:/var/lib/postgresql/data
      - /home/signal-bot-selfhosted/database:/docker-entrypoint-initdb.d:ro
      - /home/signal-bot-selfhosted/data/backups:/backups
    networks:
      - signal-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: signal-bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /home/signal-bot-selfhosted/data/redis:/data
    networks:
      - signal-bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Signal Bot Application
  # ============================================================================
  signal-bot:
    build:
      context: /home/signal-bot-selfhosted/bot
      dockerfile: Dockerfile.selfhosted
    container_name: signal-bot-selfhosted
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database configuration
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: signal_bot
      DB_USER: signal_bot
      DB_PASSWORD: ${DB_PASSWORD:-changeme123}

      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379

      # Signal configuration
      SIGNAL_PHONE_NUMBER: ${SIGNAL_PHONE:-+19108471202}
      SIGNAL_CLI_CONFIG_DIR: /app/signal-data

      # OpenAI configuration (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Discourse configuration (optional)
      DISCOURSE_URL: ${DISCOURSE_URL:-}
      DISCOURSE_API_KEY: ${DISCOURSE_API_KEY:-}
      DISCOURSE_USERNAME: ${DISCOURSE_USERNAME:-}
      DISCOURSE_QA_CATEGORY: ${DISCOURSE_QA_CATEGORY:-5}

      # Application configuration
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: info
    volumes:
      - /home/signal-bot-selfhosted/data/signal-data:/app/signal-data
      - /home/signal-bot-selfhosted/data/downloads:/tmp
    ports:
      - "8082:8080"
    networks:
      - signal-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # PostgreSQL Backup (Optional)
  # ============================================================================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: signal-bot-backup
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: signal_bot
      POSTGRES_USER: signal_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - /home/signal-bot-selfhosted/data/backups:/backups
    networks:
      - signal-bot-network

  # ============================================================================
  # pgAdmin (Optional - Web UI for PostgreSQL)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: signal-bot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@signal-bot.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - /home/signal-bot-selfhosted/data/pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - signal-bot-network
    profiles:
      - debug  # Only start with: docker-compose --profile debug up

networks:
  signal-bot-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  signal-data:
  downloads:
  backups:
  pgadmin-data:
